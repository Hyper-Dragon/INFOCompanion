[package]
name = "infocompanion-webui"
version = "0.1.0"
edition = "2021"
description = "The panes, in a browser: a dumb mux over the daemon's own SSH seat interface."
publish = false

# A second crate of the project, not a second language: it is built by the same Rust stage in
# the same image, and it speaks to the daemon with `russh` — the crate the daemon serves with,
# here used as a client. One SSH implementation, both ends; any disagreement between them is
# ours to fix in one place.
[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
# The voice endpoint is somebody else's server (`08_webui_tts.md` §7): this is the client half of
# that interface, and the only thing the project believes about it is an HTTP request.
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
russh = "0.45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }

[profile.release]
strip = true
lto = true
